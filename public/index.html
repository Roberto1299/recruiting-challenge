<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Merchant Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
      h1 { margin-bottom: 0.25rem; }
      .merchant-picker { margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; }
      .search-form { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem; }
      .search-form input, .search-form select { padding: 0.35rem; }
      .pagination { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.75rem; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin: 1rem 0; }
      .card { border: 1px solid #ccc4; border-radius: 8px; padding: 1rem; }
      .card .label { font-size: 0.85rem; opacity: 0.7; }
      .card .value { font-size: 1.6rem; font-weight: 600; margin-top: 0.25rem; }
      table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
      th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ccc4; }
      th { font-weight: 600; opacity: 0.8; }
      .muted { opacity: 0.6; }
    </style>
  </head>
  <body>
    <h1>Merchant Dashboard</h1>
    <p class="muted">Tiny demo dashboard backed by the local API.</p>

    <div class="merchant-picker">
      <label>Logged in as:
        <select id="merchant-select">
          <option value="m_acme">Acme Supplies</option>
          <option value="m_bistro">Bistro Verde</option>
        </select>
      </label>
      <button id="export-csv-btn" type="button">Download CSV</button>
    </div>

    <section>
      <h2>Summary</h2>
      <div class="cards" id="summary-cards">
        <div class="card"><div class="label">Total orders</div><div class="value" id="total-orders">—</div></div>
        <div class="card"><div class="label">Unique customers</div><div class="value" id="unique-customers">—</div></div>
        <div class="card"><div class="label">Avg order value</div><div class="value" id="avg-order">—</div></div>
        <div class="card"><div class="label">Revenue (last 30 days)</div><div class="value" id="revenue-30d">—</div></div>
      </div>
    </section>

    <section>
      <h2>Orders</h2>
      <form id="search-form" class="search-form">
        <input type="text" id="search-email" placeholder="Customer email contains…" />
        <select id="search-type">
          <option value="">Any type</option>
          <option value="sale">Sale</option>
          <option value="refund">Refund</option>
        </select>
        <input type="text" id="search-status" placeholder="Status" />
        <input type="date" id="search-from" />
        <input type="date" id="search-to" />
        <button type="submit">Search</button>
      </form>
      <p class="muted" id="search-summary"></p>
      <table>
        <thead>
          <tr><th>Date</th><th>Customer</th><th>Type</th><th>Status</th><th>Amount</th></tr>
        </thead>
        <tbody id="search-tbody"></tbody>
      </table>
      <div class="pagination">
        <button type="button" id="search-prev" disabled>Prev</button>
        <span id="search-page-label"></span>
        <button type="button" id="search-next" disabled>Next</button>
      </div>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
